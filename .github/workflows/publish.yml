name: Publish
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Which data loaders to refresh cache for"
        type: choice
        options: [all, media-counts, nmf]
        default: all
  schedule:
    - cron: "0 13 * * 5" # Fridays 6am MST / 7am MDT
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
permissions:
  contents: write
jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source mtimes
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r env/python-reqs.txt

      - name: Retrieve Google SA file
        env:
          GSHEET_SA_BASE64: ${{ secrets.GSHEET_SA_BASE64 }}
        run: |
          echo $GSHEET_SA_BASE64 | base64 --decode > gsheet-sa.json

      - name: Retrieve other secret keys
        env:
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
        run: |
          echo "$SECRET_KEYS" > env/secrets.json

      - name: Restore data loader cache
        uses: actions/cache@v4
        with:
          path: docs/.observablehq/cache
          key: framework-cache-${{ github.run_id }}
          restore-keys: framework-cache-

      - name: Invalidate data loader cache
        env:
          REFRESH: ${{ github.event_name == 'schedule' && 'all' || inputs.refresh || 'none' }}
          MEDIA_COUNTS_LOADERS: "media-counts.json media-counts-update-log.json"
          NMF_LOADERS: "new-music-friday.json"
        run: |
          CACHE=docs/.observablehq/cache
          rm -f "$CACHE/data/toc.json" # cheap and derived from page files, so always rebuild
          case "$REFRESH" in
            all)          rm -rf "$CACHE" ;;
            media-counts) for f in $MEDIA_COUNTS_LOADERS; do rm -f "$CACHE/data/$f"; done ;;
            nmf)          for f in $NMF_LOADERS; do rm -f "$CACHE/data/$f"; done ;;
          esac
          echo "refresh=$REFRESH"

      - name: Build
        env:
          MEDIA_COUNTS_PAT: ${{ secrets.MEDIA_COUNTS_PAT }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
